[package]
name = "backstop-manager"
version = "2.1.100"
authors = ["6th Street Radio LLC <davek@6thstreetradio.org>"]
license = "AGPL-3.0"
edition = "2021"
rust-version = "1.91.1"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = "=27.0.3"

[dev-dependencies]
soroban-sdk = { version = "=27.0.3", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
